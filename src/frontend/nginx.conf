server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # Hashed assets are immutable; the entry document must never be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # The SPA calls /api relative, so the browser never needs to know the API host.
    location /api/ {
        proxy_pass http://api:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streaming responses must not be buffered or they arrive as one block.
        proxy_buffering off;
        proxy_cache off;
        proxy_read_timeout 300s;
    }

    # Client-side routing: unknown paths return the SPA shell, not a 404.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
