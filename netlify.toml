# Netlify builds the SPA only. The .NET API is a separate deployment — see the
# "Deploying" section of README.md. Routing lives in the generated _redirects
# file (src/frontend/scripts/generate-redirects.mjs) rather than here, because
# the API proxy target has to come from an environment variable and netlify.toml
# cannot interpolate those.

[build]
  base    = "src/frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 and TypeScript 6 need a current Node.
  NODE_VERSION = "22"

  # Netlify cannot run the .NET API, so the deployed SPA answers its own
  # requests from the bundled seed content and keeps progress in localStorage.
  # To point this deployment at a real API instead, set VITE_DEMO_MODE to
  # "false" and API_PROXY_TARGET to the API's absolute URL.
  VITE_DEMO_MODE = "true"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Hashed asset filenames are immutable; the entry document never is.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
