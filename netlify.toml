# Netlify builds the SPA only. The .NET API is a separate deployment — see the
# "Deploying" section of README.md. Routing lives in the generated _redirects
# file (src/frontend/scripts/generate-redirects.mjs) rather than here, because
# the API proxy target has to come from an environment variable and netlify.toml
# cannot interpolate those.

[build]
  base    = "src/frontend"
  command = "npm run build"
  publish = "dist"

[build.environment]
  # Vite 8 and TypeScript 6 need a current Node.
  NODE_VERSION = "22"

  # Demo mode answers every request in the browser from the bundled seed
  # content, for a deployment with no API behind it. "false" makes the SPA call
  # the real API through the proxy rule below. Netlify gives values set here
  # precedence over the ones set in its UI, so this is the switch that counts.
  VITE_DEMO_MODE = "false"

  # Proxy target for /api/*, read by scripts/generate-redirects.mjs. Proxying
  # rather than calling the API directly keeps the browser on one origin: no
  # CORS grant to maintain, and — while the API is plain HTTP — no mixed-content
  # block, because this hop happens on Netlify's side, not in the browser.
  API_PROXY_TARGET = "http://35.196.141.157:5080"

[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options        = "DENY"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy        = "strict-origin-when-cross-origin"

# Hashed asset filenames are immutable; the entry document never is.
[[headers]]
  for = "/assets/*"
  [headers.values]
    Cache-Control = "public, max-age=31536000, immutable"

[[headers]]
  for = "/index.html"
  [headers.values]
    Cache-Control = "no-cache"
